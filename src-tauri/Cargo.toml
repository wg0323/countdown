[package]
name = "countdown"
version = "0.1.0"
description = "桌面翻牌倒计时"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-single-instance = "2.5.4"
